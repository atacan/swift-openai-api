
name: Secret Scanning

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  scan_range:
    name: Resolve incoming commits
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.range.outputs.base }}
      head: ${{ steps.range.outputs.head }}
      log_opts: ${{ steps.range.outputs.log_opts }}
      scan: ${{ steps.range.outputs.scan }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve scan range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PUSH_DELETED: ${{ github.event.deleted }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == push && "$PUSH_DELETED" == true ]]; then
            echo "scan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          resolve_commit() {
            git rev-parse --verify "${1}^{commit}" || {
              echo "::error::Cannot resolve required scan commit: $1" >&2
              return 1
            }
          }

          base=""
          case "$EVENT_NAME" in
            pull_request)
              head=$(resolve_commit "$PR_HEAD")
              pr_base=$(resolve_commit "$PR_BASE")
              base=$(git merge-base "$pr_base" "$head") || {
                echo "::error::Cannot find pull request merge-base." >&2
                exit 1
              }
              ;;
            push)
              head=$(resolve_commit "$PUSH_AFTER")
              if [[ "$PUSH_BEFORE" != "$zero_sha" ]]; then
                base=$(resolve_commit "$PUSH_BEFORE")
              elif [[ "$PUSH_REF" != "refs/heads/$DEFAULT_BRANCH" ]] &&
                   git show-ref --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH"; then
                base=$(git merge-base "refs/remotes/origin/$DEFAULT_BRANCH" "$head") || {
                  echo "::error::Cannot find new branch merge-base." >&2
                  exit 1
                }
              fi
              ;;
            *)
              echo "::error::Unsupported scan event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          # An empty base denotes the repository's initial imported history.
          if [[ -n "$base" ]]; then
            if [[ $(git rev-list --count "$base..$head") == 0 ]]; then
              echo "scan=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            log_opts="--root $base..$head"
          else
            log_opts="--root $head"
          fi
          {
            echo "base=$base"
            echo "head=$head"
            echo "log_opts=$log_opts"
            echo "scan=true"
          } >> "$GITHUB_OUTPUT"

  betterleaks:
    name: Betterleaks
    needs: scan_range
    if: needs.scan_range.outputs.scan == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.scan_range.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Betterleaks v1.9.0
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d "$RUNNER_TEMP/betterleaks.XXXXXX")
          release_url=https://github.com/betterleaks/betterleaks/releases/download/v1.9.0
          archive=betterleaks_1.9.0_linux_x64.tar.gz
          curl --fail --silent --show-error --location \
            "$release_url/$archive" --output "$scanner_dir/$archive"
          curl --fail --silent --show-error --location \
            "$release_url/checksums.txt" --output "$scanner_dir/checksums.txt"
          (cd "$scanner_dir" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$scanner_dir/$archive" -C "$scanner_dir" betterleaks
          echo "$scanner_dir" >> "$GITHUB_PATH"
      - name: Scan incoming commits
        shell: bash
        env:
          SCAN_LOG_OPTS: ${{ needs.scan_range.outputs.log_opts }}
        run: betterleaks git . --log-opts="$SCAN_LOG_OPTS" --redact --verbose

  trufflehog:
    name: TruffleHog
    needs: scan_range
    if: needs.scan_range.outputs.scan == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.scan_range.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@v3.97.9
        with:
          version: "3.97.9"
          base: ${{ needs.scan_range.outputs.base }}
          head: ${{ needs.scan_range.outputs.head }}
          extra_args: --results=verified --fail-on-scan-errors
