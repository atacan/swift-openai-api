# OpenAPI Overlay for SwiftOpenaiApi
# This file allows you to make manual corrections to the OpenAPI specification
# without modifying the original file. The bootstrapper will apply this overlay
# on top of the cleaned openapi.yaml file.
#
# For overlay syntax, see: https://github.com/OAI/Overlay-Specification

overlay: 1.0.0
info:
  title: SwiftOpenaiApi API Overlay
  version: 1.0.0

# Example actions (uncomment and modify as needed):
# actions:
#   # Make a field required
#   - target: "$.components.schemas.User"
#     update:
#       required:
#         - user_id
#         - email
#
#   # Add a missing property
#   - target: "$.components.schemas.Product"
#     update:
#       properties:
#         newField:
#           type: string
#           description: "A field that was missing in the original spec"
#
#   # Fix an incorrect type
#   - target: "$.components.schemas.Order.properties.total"
#     update:
#       type: number
#       format: double
#
#   # Remove a deprecated field
#   - target: "$.components.schemas.LegacyModel.properties.oldField"
#     remove: true

actions:
  # swift-openapi-generator does not support OpenAPI 3.1 webhooks.
  - target: $.webhooks
    remove: true

  # The published OpenAPI document references this schema but omits its definition.
  - target: $.components.schemas
    update:
      ChatCompletionMessageCustomToolCall:
        type: object
        title: Chat completion message custom tool call
        description: A call to a custom tool created by the model.
        required:
          - id
          - custom
          - type
        properties:
          id:
            type: string
            description: The ID of the tool call.
          custom:
            type: object
            description: The custom tool that the model called.
            required:
              - input
              - name
            properties:
              input:
                type: string
                description: The input for the custom tool call generated by the model.
              name:
                type: string
                description: The name of the custom tool to call.
            additionalProperties: false
          type:
            type: string
            enum:
              - custom
            description: The type of the tool. Always `custom`.
        additionalProperties: false
