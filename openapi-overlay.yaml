# OpenAPI Overlay for SwiftOpenaiApi
# This file allows you to make manual corrections to the OpenAPI specification
# without modifying the original file. The bootstrapper will apply this overlay
# on top of the cleaned openapi.yaml file.
# Wire-value discriminator mappings are inferred by bootstrapper op14.
#
# For overlay syntax, see: https://github.com/OAI/Overlay-Specification

overlay: 1.0.0
info:
  title: SwiftOpenaiApi API Overlay
  version: 1.0.0

# Example actions (uncomment and modify as needed):
# actions:
#   # Make a field required
#   - target: "$.components.schemas.User"
#     update:
#       required:
#         - user_id
#         - email
#
#   # Add a missing property
#   - target: "$.components.schemas.Product"
#     update:
#       properties:
#         newField:
#           type: string
#           description: "A field that was missing in the original spec"
#
#   # Fix an incorrect type
#   - target: "$.components.schemas.Order.properties.total"
#     update:
#       type: number
#       format: double
#
#   # Remove a deprecated field
#   - target: "$.components.schemas.LegacyModel.properties.oldField"
#     remove: true

actions:
  # The generator ignores inline oneOf variants when a discriminator is present.
  # These VAD variants already have distinct, required type values.
  - target: $.components.schemas.RealtimeTurnDetection.discriminator
    remove: true

  # Express the nullable noise reduction object using a supported schema shape.
  # Keep its existing properties and optionality.
  - target: $.components.schemas.RealtimeTranscriptionSessionCreateRequest.properties.input_audio_noise_reduction.not
    remove: true
  - target: $.components.schemas.RealtimeTranscriptionSessionCreateRequest.properties.input_audio_noise_reduction
    update:
      type: object

  # swift-openapi-generator does not support OpenAPI 3.1 webhooks.
  - target: $.webhooks
    remove: true

  # Completed and in-progress Responses contain error: null. Keep the other
  # required response fields while making the error object optional in Swift.
  - target: $.components.schemas.Response.allOf[2].required
    remove: true
  - target: $.components.schemas.Response.allOf[2]
    update:
      required:
        - id
        - object
        - created_at
        - output
        - parallel_tool_calls

  # A message can omit its type, and both input and output messages use
  # type: message. These unions cannot dispatch uniquely on type alone.
  - target: $.components.schemas.InputItem.discriminator
    remove: true
  - target: $.components.schemas.Item.discriminator
    remove: true

  # gpt-transcribe reports duration usage in its terminal event; legacy models
  # report token usage. Both carry a required, unambiguous type tag.
  - target: $.components.schemas.TranscriptTextDoneEvent.properties.usage
    remove: true
  - target: $.components.schemas.TranscriptTextDoneEvent.properties
    update:
      usage:
        oneOf:
          - $ref: '#/components/schemas/TranscriptTextUsageTokens'
          - $ref: '#/components/schemas/TranscriptTextUsageDuration'
        discriminator:
          propertyName: type
          mapping:
            tokens: '#/components/schemas/TranscriptTextUsageTokens'
            duration: '#/components/schemas/TranscriptTextUsageDuration'

  # A verbose translation also satisfies the simple text schema. anyOf models
  # this overlap and retains both views instead of dropping the verbose fields.
  - target: "$['paths']['/audio/translations']['post']['responses']['200']['content']['application/json']['schema']['oneOf']"
    remove: true
  - target: "$['paths']['/audio/translations']['post']['responses']['200']['content']['application/json']['schema']"
    update:
      anyOf:
        - $ref: '#/components/schemas/CreateTranslationResponseJson'
        - $ref: '#/components/schemas/CreateTranslationResponseVerboseJson'

  # The multipart wire names for arrays include brackets, as in the documented
  # curl requests. Preserve item types and bounds while correcting those names.
  - target: $.components.schemas.CreateTranscriptionRequest.properties
    update:
      'languages[]':
        type: array
        minItems: 1
        items:
          type: string
        description: Possible languages of the input audio, using ISO-639-1 codes. Supported by gpt-transcribe.
      'keywords[]':
        type: array
        items:
          type: string
        description: Words or phrases to guide transcription of the input audio. Supported by gpt-transcribe.
      'include[]':
        type: array
        items:
          $ref: '#/components/schemas/TranscriptionInclude'
        description: >-
          Additional information to include in the transcription response. logprobs
          requires response_format json and is supported by gpt-4o-transcribe,
          gpt-4o-mini-transcribe, and gpt-4o-mini-transcribe-2025-12-15. Not supported
          by gpt-4o-transcribe-diarize.
      'timestamp_granularities[]':
        type: array
        items:
          type: string
          enum: [word, segment]
        default: [segment]
        description: >-
          Timestamp granularities to include with verbose_json. Either or both
          word and segment are supported. Word timestamps incur additional latency;
          segment timestamps do not. Not supported by gpt-4o-transcribe-diarize.
      'known_speaker_names[]':
        type: array
        maxItems: 4
        items:
          type: string
        description: >-
          Short speaker identifiers matching known_speaker_references[]. Up to
          four known speakers are supported.
      'known_speaker_references[]':
        type: array
        maxItems: 4
        items:
          type: string
        description: >-
          Reference audio data URLs matching known_speaker_names[]. Each sample
          must be between 2 and 10 seconds, using a supported input audio format.
  - target: $.components.schemas.CreateTranscriptionRequest.properties.languages
    remove: true
  - target: $.components.schemas.CreateTranscriptionRequest.properties.keywords
    remove: true
  - target: $.components.schemas.CreateTranscriptionRequest.properties.include
    remove: true
  - target: $.components.schemas.CreateTranscriptionRequest.properties.timestamp_granularities
    remove: true
  - target: $.components.schemas.CreateTranscriptionRequest.properties.known_speaker_names
    remove: true
  - target: $.components.schemas.CreateTranscriptionRequest.properties.known_speaker_references
    remove: true

  # Uploads contain binary audio. Explicit encoding avoids inferring text/plain
  # from the legacy format: binary annotation in the OpenAPI 3.1 source.
  - target: "$['paths']['/audio/transcriptions']['post']['requestBody']['content']['multipart/form-data']"
    update:
      encoding:
        file:
          contentType: application/octet-stream
  - target: "$['paths']['/audio/translations']['post']['requestBody']['content']['multipart/form-data']"
    update:
      encoding:
        file:
          contentType: application/octet-stream

  - target: $.paths.*.post.responses
    update:
      '400':
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
        description: The request was malformed, missing required fields, or invalid parameters
      '401':
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
        description: Invalid Authentication, Incorrect API key provided, You must be a
          member of an organization to use the API
      '403':
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
        description: Country, region, or territory not supported
      '404':
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
        description: The requested resource was not found
      '413':
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
        description: Request body too large
      '429':
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
        description: Rate limit reached for requests, You exceeded your current quota,
          please check your plan and billing details
      '500':
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
          plain/text:
            schema:
              type: string
        description: The server had an error while processing your request
      '503':
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
        description: The engine is currently overloaded, please try again later
